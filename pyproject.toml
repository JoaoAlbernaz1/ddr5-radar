[project]
name = "ddr5-radar"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.47",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["rede: bate na loja de verdade; nao roda por padrao"]
addopts = "-m 'not rede'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
