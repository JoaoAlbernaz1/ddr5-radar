name: Check Prices

on:
  schedule:
    - cron: '*/30 * * * *' # GitHub may delay scheduled runs
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scraper/**'
      - '.github/workflows/check-prices.yml'

permissions:
  contents: read

concurrency:
  group: partwatch-price-check
  cancel-in-progress: false

jobs:
  scraper-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scraper/requirements.txt
      - name: Run offline scraper checks
        run: python -m unittest discover -s scraper/tests -v

  check-prices:
    # Not configured by default: prevent repeated failing scheduled jobs.
    # To enable, configure both secrets and repository variable
    # PRICE_CHECK_ENABLED=true (see README).
    # Manual dispatch deliberately runs even when disabled, to diagnose setup.
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || vars.PRICE_CHECK_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials before installing dependencies
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is missing. Add the repository Actions secret."
            missing=1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing. Add the repository Actions secret."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "## Price checking not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Add both secrets under Settings > Secrets and variables > Actions > Secrets." >> "$GITHUB_STEP_SUMMARY"
            echo "Set the repository variable PRICE_CHECK_ENABLED=true to activate scheduled runs." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scraper/requirements.txt
      - name: Check prices
        run: python scraper/check_prices.py
